<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Repo Stats — a self-hosted dashboard for GitHub repository statistics, keeping the traffic history GitHub deletes after fourteen days">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1B2B"/>
      <stop offset="55%" stop-color="#10293F"/>
      <stop offset="100%" stop-color="#0A2233"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#41BDF5"/>
      <stop offset="100%" stop-color="#3DDC97"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accent)"/>

  <g stroke="#41BDF5" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200"/>
    <path d="M120 0V400M280 0V400M440 0V400M860 0V400M1020 0V400"/>
  </g>

  <text x="72" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="58" font-weight="700" fill="#F2F8FC">Repo Stats</text>
  <text x="72" y="188" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="27" font-weight="500" fill="#41BDF5">every repository, one dashboard</text>
  <text x="72" y="234" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" fill="#9FB6C6">Traffic &#183; clones &#183; stars &#183; release downloads &#183; CI &#183; Home Assistant installs</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600">
    <rect x="72" y="266" width="196" height="34" rx="17" fill="#3DDC97" fill-opacity="0.12" stroke="#3DDC97" stroke-opacity="0.45"/>
    <text x="170" y="288" fill="#86E9BE" text-anchor="middle">Keeps the history</text>
    <rect x="280" y="266" width="150" height="34" rx="17" fill="#41BDF5" fill-opacity="0.12" stroke="#41BDF5" stroke-opacity="0.45"/>
    <text x="355" y="288" fill="#8FD6F7" text-anchor="middle">Self&#8209;hosted</text>
    <rect x="442" y="266" width="132" height="34" rx="17" fill="#41BDF5" fill-opacity="0.12" stroke="#41BDF5" stroke-opacity="0.45"/>
    <text x="508" y="288" fill="#8FD6F7" text-anchor="middle">One container</text>
    <rect x="586" y="266" width="126" height="34" rx="17" fill="#7C7CF5" fill-opacity="0.12" stroke="#7C7CF5" stroke-opacity="0.45"/>
    <text x="649" y="288" fill="#B3B3FA" text-anchor="middle">DE &#183; EN</text>
  </g>

  <!-- a dashboard panel, drawn the way the real one looks -->
  <g transform="translate(846 92)">
    <rect x="0" y="0" width="282" height="216" rx="18" fill="#16202B" stroke="#28394A" stroke-width="2"/>
    <rect x="18" y="18" width="120" height="52" rx="10" fill="#0F1720" stroke="#28394A"/>
    <text x="30" y="38" font-family="-apple-system,sans-serif" font-size="10" fill="#9FB0C0">VISITORS</text>
    <text x="30" y="60" font-family="ui-monospace,Menlo,monospace" font-size="20" font-weight="700" fill="#41BDF5">293</text>
    <rect x="146" y="18" width="118" height="52" rx="10" fill="#0F1720" stroke="#28394A"/>
    <text x="158" y="38" font-family="-apple-system,sans-serif" font-size="10" fill="#9FB0C0">STARS</text>
    <text x="158" y="60" font-family="ui-monospace,Menlo,monospace" font-size="20" font-weight="700" fill="#FFC107">37</text>

    <rect x="18" y="82" width="246" height="116" rx="10" fill="#0F1720" stroke="#28394A"/>
    <polyline points="32,176 60,168 84,148 108,156 132,120 156,104 180,132 204,112 228,126 250,98"
              fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <polygon points="32,190 32,176 60,168 84,148 108,156 132,120 156,104 180,132 204,112 228,126 250,98 250,190"
             fill="url(#accent)" fill-opacity="0.10"/>
  </g>
</svg>
