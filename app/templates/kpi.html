{% macro tile(label, value, tone, hint=None, sub=None) %}
<article class="kpi {{ tone }}{% if hint %} has-hint{% endif %}">
  <span class="kpi-label">{{ label }}{% if hint %}<i class="q" aria-hidden="true">?</i>{% endif %}</span>
  <span class="kpi-value">{{ value }}</span>
  {% if sub %}<span class="kpi-sub">{{ sub }}</span>{% endif %}
  {% if hint %}<span class="hint-box">{{ hint | safe }}</span>{% endif %}
</article>
{% endmacro %}
